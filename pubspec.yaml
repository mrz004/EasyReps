publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  csv: ^8.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
